name: HRD DEV Verify
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hrd-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: HRD DEV typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck (do not allow build script to mask TypeScript failures)
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
